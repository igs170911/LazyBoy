[project]
name = "lazyboy"
version = "0.2.0"
description = "LazyBoy: persistent bots, each with its own computer, driven from the web"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
    "pyyaml>=6,<7",
    "croniter>=6,<7",
    "cryptography>=46,<47",
    "opencc-python-reimplemented>=0.1.7",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
